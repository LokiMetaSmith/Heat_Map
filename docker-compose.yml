version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: heatmap
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heatmap"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-node:
    build: .
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=heatmap
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

  app-php:
    build:
      context: ./php
    ports:
      - "3000:80"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=heatmap
      - POSTGRES_PORT=5432
    volumes:
      - ./php/src:/var/www/html/src
      - ./php/vendor:/var/www/html/vendor
      - ./public:/var/www/html/public
      - ./php/.htaccess:/var/www/html/.htaccess
      - ./php/index.php:/var/www/html/index.php
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
